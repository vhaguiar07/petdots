name: petdots-mvp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: petdots
      POSTGRES_PASSWORD: petdots
      POSTGRES_DB: petdots
    ports:
      - '5437:5432'
    volumes:
      - petdots-mvp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petdots -d petdots']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petdots-mvp-postgres-data:
