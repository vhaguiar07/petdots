services:
  postgres:
    image: postgres:16-alpine
    container_name: petdots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petdots
      POSTGRES_PASSWORD: petdots
      POSTGRES_DB: petdots
    ports:
      - "5436:5432"
    volumes:
      - petdots-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: petdots-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petdots
      MINIO_ROOT_PASSWORD: petdots123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petdots-minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: petdots-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 petdots petdots123; do sleep 1; done;
      mc mb --ignore-existing local/petdots-uploads;
      mc anonymous set download local/petdots-uploads;
      "

  loki:
    image: grafana/loki:3.0.0
    container_name: petdots-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - petdots-loki-data:/loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: petdots-grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "3300:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - petdots-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning

volumes:
  petdots-postgres-data:
  petdots-minio-data:
  petdots-loki-data:
  petdots-grafana-data:
